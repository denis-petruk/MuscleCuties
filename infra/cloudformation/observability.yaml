AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MuscleCuties staging observability: one SNS topic that reaches a human, metric alarms
  for the API and the database, CloudFormation drift notification, and the native RDS
  event subscription for backup / failure / low storage.

  The topic is account-unique by name, so it cannot be imported while the legacy
  Observability stack still owns it. The legacy stack is deleted first, then this one
  creates the topic. Its only current alarm has no subscribers, so the gap is inert.

  RDS backup and storage conditions are covered by the native event subscription rather
  than a hand-made metric alarm: there is no useful CloudWatch metric for "a backup
  failed", and inventing one would be a false sense of coverage.

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging]

  ApiFunctionName:
    Type: String
    Default: musclecuties-staging-backend-api

  DbInstanceIdentifier:
    Type: String
    Default: musclecuties-staging-postgres

  NotificationEmail:
    Type: String
    Default: deniska.petruk@icloud.com

  ApiErrorThreshold:
    Type: Number
    Default: 5

  ApiLatencyP99ThresholdMs:
    Type: Number
    Default: 5000
    Description: Agreed p99 budget for a warm request. Must stay well below the 27 s
      function timeout, so that a latency alarm fires before the timeout does.

  RdsCpuThresholdPercent:
    Type: Number
    Default: 80

  RdsConnectionsThreshold:
    Type: Number
    Default: 80
    Description: The instance allows ~87 connections at db.t4g.micro; 80 leaves headroom.

# ---------------------------------------------------------------------------------------
# FAITHFULNESS RECORD — checked 2026-11-19 against `sns get-topic-attributes`,
# `cloudwatch describe-alarms`, `events list-rules` and `rds describe-event-subscriptions`.
#
# The topic is CREATED, not imported: its name is account-unique, so it cannot exist in two
# stacks, and the legacy Observability stack still owns it. TopicName matches the live value
# exactly; live DisplayName is empty, so this file does not set one.
#
# ALARM SEMANTICS vs the one live alarm (`MuscleCuties-backend-api-Errors`): identical —
# AWS/Lambda Errors, Sum, 300 s, 1 evaluation, threshold 5, GreaterThanOrEqualToThreshold,
# notBreaching, same SNS action. Only the name differs, because these are new resources
# under the musclecuties-staging-* convention.
#
# ACCEPT-AND-RECONCILE: the live alarm is unmanaged and will still exist after this stack
# deploys, so the same condition would page twice. Delete it once these alarms are live:
#   aws cloudwatch delete-alarms --alarm-names MuscleCuties-backend-api-Errors
#
# NEW, with nothing to compare against (confirmed absent before this stack exists): the
# drift EventBridge rule and the RDS event subscription.
# ---------------------------------------------------------------------------------------

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "musclecuties-${Environment}-operational-alarms"
      Tags:
        - { Key: Project, Value: MuscleCuties }
        - { Key: Environment, Value: !Ref Environment }

  # Subscribing an address only makes alarms real once someone confirms the email.
  OperatorEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # EventBridge needs explicit publish rights on the topic.
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlarmTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDriftRuleToPublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              ArnLike:
                AWS:SourceArn: !GetAtt DriftRule.Arn

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "musclecuties-${Environment}-backend-api-errors"
      AlarmDescription: Five or more Lambda invocation errors in five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref ApiFunctionName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ApiErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiLatencyP99Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "musclecuties-${Environment}-backend-api-latency-p99"
      AlarmDescription: Lambda p99 duration above the budget for 15 minutes.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - { Name: FunctionName, Value: !Ref ApiFunctionName }
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref ApiLatencyP99ThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "musclecuties-${Environment}-rds-cpu"
      AlarmDescription: Sustained database CPU above the threshold.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref DbInstanceIdentifier }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref RdsCpuThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  RdsConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "musclecuties-${Environment}-rds-connections"
      AlarmDescription: Connection count approaching the instance limit.
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref DbInstanceIdentifier }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref RdsConnectionsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Drift is the control that keeps "every resource is declared" true over time.
  DriftRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "musclecuties-${Environment}-stack-drift"
      Description: Publishes CloudFormation drift detections that report DRIFTED.
      State: ENABLED
      EventPattern:
        source:
          - aws.cloudformation
        detail-type:
          - "CloudFormation Drift Detection Status"
        detail:
          stackDriftStatus:
            - DRIFTED
      Targets:
        - Id: drift-to-alarm-topic
          Arn: !Ref AlarmTopic

  DbEventSubscription:
    Type: AWS::RDS::EventSubscription
    Properties:
      SubscriptionName: !Sub "musclecuties-${Environment}-rds-events"
      SnsTopicArn: !Ref AlarmTopic
      SourceType: db-instance
      SourceIds:
        - !Ref DbInstanceIdentifier
      EventCategories:
        - backup
        - failure
        - low storage
      Enabled: true

Outputs:
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub "${AWS::StackName}-AlarmTopicArn"
