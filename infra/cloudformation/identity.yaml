AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MuscleCuties staging identity plane: GitHub Actions OIDC federation and the three
  least-privilege deploy roles. Faithful to live state as of 2026-11-19 plus the
  2026-11-20 s3:ListBucket correction; the remaining known defects are documented below.

# ---------------------------------------------------------------------------------------
# FAITHFULNESS RECORD — every property compared against `aws iam get-role`,
# `get-role-policy` and `get-open-id-connect-provider` on 2026-11-19.
#
# CloudFormation import does not compare template to live ("CloudFormation doesn't check
# that the template configuration matches the actual configuration"), so any deliberate
# divergence simply appears afterwards as stack drift. This file therefore describes
# exactly what exists, including two things that are wrong.
#
# RECONCILE STATUS re-checked 2026-11-24 against live IAM:
#   1. CLOSED. S3ArtifactPutOnly names musclecuties-release-artifacts-028417007003, which is
#      the bucket that exists and is in use; the earlier "renamed in Phase 4" note described a
#      rename that never happened.
#   2. CLOSED in the template 2026-11-24. GitHubActionsBetaDeployRole already named the only
#      live function, musclecuties-backend-api. GitHubActionsStagingDeployRole named
#      MuscleCuties-Server-Staging and MuscleCuties-Reconciliation-Staging, neither of which
#      exists; those dead grants are removed rather than repointed at the live function,
#      because repointing would let a GitHub `staging`-environment job publish production
#      code. Consequence, stated plainly: the live role keeps that inert inline policy until
#      the owner next runs update-stack, at which point it is pruned.
# The earlier text here said both defects were deferred so the import would not report
# NOT IN_SYNC. That is history: this file is now the deployed template, and the deferral is
# recorded as an owner decision instead of being hidden.
#
# 2026-11-20 — this file is now the deployed template, not only an adoption record:
#   * Logical IDs are the stack's real ones (GitHubActionsArtifactUploadRole,
#     GitHubActionsStagingDeployRole, GitHubActionsBetaDeployRole, GitHubOidcProvider). The
#     shortened names used while drafting the import would have made update-stack create a
#     second role with an already-taken RoleName instead of updating the existing one.
#   * S3ArtifactPutOnly gained s3:ListBucket on the bucket ARN. That is a live correction,
#     not part of the accept-and-reconcile list: a HeadObject on an absent key returns 403,
#     not 404, without it, and upload-artifact.sh aborted every release run.
# ---------------------------------------------------------------------------------------

Parameters:
  # There is deliberately no Environment parameter: nothing in this template consumed it,
  # and a parameter whose only value is unused cannot keep the file honest.
  GitHubOrg:
    Type: String
    Default: denis-petruk

  RepositoryName:
    Type: String
    Default: MuscleCuties

  # Live value. Renaming this bucket is what makes item 1 above a defect.
  ReleaseArtifactsBucket:
    Type: String
    Default: musclecuties-release-artifacts-028417007003

  # The Lambda execution role the app stack also references (app.yaml ExecutionRoleArn).
  # It was created with the function and is not adopted here; this stack only attaches a
  # narrowly scoped SES sending policy to it by name.
  BackendApiExecutionRoleName:
    Type: String
    Default: musclecuties-backend-api-role-oot9kwhk

  OidcThumbprints:
    Type: CommaDelimitedList
    Default: "6938fd4d98bab03faadb97b34396831e3780aea1,1c5876104010567b1a7d8ee0e69f6940cc73b73f"

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList: !Ref OidcThumbprints

  GitHubActionsArtifactUploadRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: MuscleCuties-GitHubActions-ArtifactUpload
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # The upload_artifacts job in backend-release.yml declares `environment: beta`,
              # so GitHub presents sub=...:environment:beta, never ...:ref:refs/heads/main.
              # Scoping to the ref claim alone would deny the one legitimate caller; the ref
              # claim is pinned separately so a beta-environment job from another branch is
              # still refused.
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${RepositoryName}:environment:beta"
                token.actions.githubusercontent.com:ref: refs/heads/main
      Policies:
        - PolicyName: S3ArtifactPutOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # PutObject writes the release object; the read actions are required by
                # upload-artifact.sh, which head-objects the written object (and the exact
                # version) to prove its checksum and metadata before handing it to Lambda.
                Action:
                  - s3:PutObject
                  - s3:PutObjectLegalHold
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:aws:s3:::${ReleaseArtifactsBucket}/*"
              - Effect: Allow
                # CORRECTION 2026-11-20. Without ListBucket a HeadObject on a key that does
                # not exist yet answers 403 instead of 404 (S3 hides existence), and
                # upload-artifact.sh treats that as "cannot inspect existing object" and
                # aborts before the first PutObject. Every release run therefore failed
                # until this statement existed. Scoped to the bucket itself, no /*, so it
                # permits the existence probe and nothing beyond it.
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${ReleaseArtifactsBucket}"

  # Transactional verification codes are sent through SES v2. Sending is authorized by this
  # attached policy, so the application stores no provider API key: neither the Lambda
  # environment nor the Secrets Manager payload carries an email credential.
  # Scoped to the one verified identity this account sends from; not account-wide SES access.
  BackendApiSesSendPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: MuscleCuties-BackendApi-SesSend
      Description: >-
        Lets the beta API function send registration and password-recovery codes through
        SES v2 from the verified musclecuties.app identity, attributed to the
        musclecuties-email-challenges configuration set.
      Roles:
        - !Ref BackendApiExecutionRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SendVerificationCodesFromVerifiedIdentity
            Effect: Allow
            Action:
              - ses:SendEmail
            # Sending with a configuration set is authorized against the configuration set
            # resource as well as the identity, so both must be listed or SES answers
            # AccessDenied once SES:ConfigurationSetName is configured.
            Resource:
              - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/musclecuties.app"
              - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/musclecuties-email-challenges"

  GitHubActionsStagingDeployRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: MuscleCuties-GitHubActions-StagingDeploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${RepositoryName}:environment:staging"
      # No Policies on purpose. The live role still carries an inline LambdaStagingDeploy
      # policy whose four resource ARNs are MuscleCuties-Server-Staging and
      # MuscleCuties-Reconciliation-Staging; neither function exists, so the policy grants
      # nothing today. Repointing those ARNs at musclecuties-backend-api would let any job
      # running in the GitHub `staging` environment update the live function and move its
      # alias - a permission widening, not a reconciliation - so the dead statements are
      # dropped instead of repointed. Applying this template prunes an inert inline policy;
      # re-add a scoped policy only when a staging function actually exists.

  GitHubActionsBetaDeployRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: MuscleCuties-GitHubActions-BetaDeploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${RepositoryName}:environment:beta"
      Policies:
        - PolicyName: LambdaBetaDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:PublishVersion
                  - lambda:UpdateAlias
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:musclecuties-backend-api"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:musclecuties-backend-api:*"

# ---------------------------------------------------------------------------------------
# REMAINING MISMATCH — checked again 2026-11-24, deliberately not changed:
#   GitHubActionsStagingDeployRole / LambdaStagingDeploy still names
#   ...:function:MuscleCuties-Server-Staging and ...:function:MuscleCuties-Reconciliation-Staging.
#   Neither function exists (the only function in the account is musclecuties-backend-api), so
#   that role can deploy nothing today.
#
#   It is left as-is because both ways of removing the dangling names are decisions the owner
#   must make, not repairs an agent may pick:
#     - repointing it at musclecuties-backend-api would let any job running in the GitHub
#       `staging` environment update the live function's code and move its alias: a real
#       permission widening, not a reconciliation;
#     - deleting the role needs `aws iam delete-role` against live IAM, which is destructive
#       and outside "describe production truthfully".
#   Either choice is one update-stack (or one delete) and is recorded in docs/STATUS.md.
#
# The S3ArtifactPutOnly resource above already names the live bucket, so the earlier item 1 is
# closed: no template references musclecuties-staging-release-artifacts-*.
#
# BetaDeploy is correct: the only function in the account is musclecuties-backend-api, and
# tools/deployment/deploy_release.py drives it through update-function-code, publish-version,
# update-alias and get-function(-configuration).
#
# The GitLab OIDC provider (gitlab.com) that used to sit here unmanaged was deleted on
# 2026-11-19. No role ever trusted it, so removing it changed nothing at runtime; GitHub
# Actions is now the only CI identity with access to this account.
# ---------------------------------------------------------------------------------------

Outputs:
  OidcProviderArn:
    Value: !GetAtt GitHubOidcProvider.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OidcProviderArn"

  ArtifactUploadRoleArn:
    Value: !GetAtt GitHubActionsArtifactUploadRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactUploadRoleArn"

  StagingDeployRoleArn:
    Value: !GetAtt GitHubActionsStagingDeployRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StagingDeployRoleArn"

  BetaDeployRoleArn:
    Value: !GetAtt GitHubActionsBetaDeployRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BetaDeployRoleArn"
