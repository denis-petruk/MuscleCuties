appId: com.musclecuties.app
---
- tapOn:
    id: QuizAnswerCurrentCyclePhase2
- tapOn:
    id: QuizNextButton
- tapOn:
    id: QuizAnswerGoal3
- scrollUntilVisible:
    element:
      id: OnboardingGluteFocusCheckBox
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: OnboardingGluteFocusCheckBox
- takeScreenshot: 05_quiz_glute_focus
- tapOn:
    id: QuizNextButton
- runFlow:
    when:
      visible:
        id: QuizAnswerGoalPace1
    commands:
      - tapOn:
          id: QuizAnswerGoalPace1
      - tapOn:
          id: QuizNextButton
- tapOn:
    id: QuizAnswerExperienceLevel1
- tapOn:
    id: QuizNextButton
- tapOn:
    id: QuizAnswerAvailableWeekdays1
- tapOn:
    id: QuizAnswerAvailableWeekdays4
- tapOn:
    id: QuizNextButton
- tapOn:
    id: QuizAnswerDietaryPreference1
- tapOn:
    id: QuizNextButton
- tapOn:
    id: QuizAnswerSessionDuration3
- tapOn:
    id: QuizNextButton
# Verify all 3 equipment options (including newly unlocked Bodyweight only!) are offered in onboarding quiz
- assertVisible:
    id: QuizAnswerEquipment3
- takeScreenshot: 05b_quiz_equipment
- tapOn:
    id: "${QA_EQUIPMENT_ANSWER_ID}"
- tapOn:
    id: QuizNextButton
- repeat:
    times: 4
    commands:
      - tapOn:
          id: QuizNextButton
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Your plan is ready|Ваш план готов"
    timeout: 60000
- tapOn: "Done|Готово"
- extendedWaitUntil:
    visible: "Today|Сегодня"
    timeout: 30000
- takeScreenshot: 06_today
