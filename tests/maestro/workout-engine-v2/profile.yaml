appId: com.musclecuties.app
---
- takeScreenshot: 04_profile_setup
- tapOn:
    id: ProfileSetupConfirmBirthDateButton
- scrollUntilVisible:
    element:
      id: ProfileSetupMetricHeightPicker
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: ProfileSetupMetricHeightPicker
- repeat:
    times: 3
    commands:
      - swipe:
          start: "50%,92%"
          end: "50%,76%"
          duration: 300
- tapOn: "Done|Готово"
- scrollUntilVisible:
    element:
      id: ProfileSetupMetricWeightPicker
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: ProfileSetupMetricWeightPicker
- repeat:
    times: 2
    commands:
      - swipe:
          start: "50%,92%"
          end: "50%,76%"
          duration: 300
- tapOn: "Done|Готово"
- scrollUntilVisible:
    element:
      text: "General strength.*|Общая силовая.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "General strength.*|Общая силовая.*"
- scrollUntilVisible:
    element:
      id: WellnessAcknowledgmentCheckBox
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: WellnessAcknowledgmentCheckBox
- tapOn:
    id: ProfileSetupContinueButton
- extendedWaitUntil:
    visible:
      id: QuizAnswerCurrentCyclePhase2
    timeout: 30000
