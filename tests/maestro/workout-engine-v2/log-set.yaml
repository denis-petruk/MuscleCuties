      - inputText: "10"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "^Done$|^Готово$"
          commands:
            - tapOn: "^Done$|^Готово$"
- runFlow:
    when:
      visible:
        id: "${QA_SET_PREFIX}RightReps"
    commands:
      - tapOn:
          id: "${QA_SET_PREFIX}RightReps"
