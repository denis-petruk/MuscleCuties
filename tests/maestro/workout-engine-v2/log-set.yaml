appId: com.musclecuties.app
---
# Fill observed synthetic values for bilateral and unilateral sets. Each row is addressed by its
# own automation id. Wait for the keyboard animation to settle before tapping Done so the toolbar
# button is never skipped while sliding in.
- runFlow:
    when:
      visible:
        id: "${QA_SET_PREFIX}Weight"
    commands:
      - tapOn:
          id: "${QA_SET_PREFIX}Weight"
      - eraseText: 5
      - inputText: "20"
      - takeScreenshot: 11b_numeric_keyboard
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "^Done$|^Готово$"
          commands:
            - tapOn: "^Done$|^Готово$"
- runFlow:
    when:
      visible:
        id: "${QA_SET_PREFIX}Reps"
    commands:
      - tapOn:
          id: "${QA_SET_PREFIX}Reps"
      - eraseText: 5
      - inputText: "10"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "^Done$|^Готово$"
          commands:
            - tapOn: "^Done$|^Готово$"
- runFlow:
    when:
      visible:
        id: "${QA_SET_PREFIX}LeftReps"
    commands:
      - tapOn:
          id: "${QA_SET_PREFIX}LeftReps"
