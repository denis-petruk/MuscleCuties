appId: com.musclecuties.app
---
# Fill observed synthetic values for bilateral and unilateral sets. Each row is addressed by its
# own automation id: falling back to the Add-set button used to satisfy scrollUntilVisible while the
# working-set rows were still below the fold, so only the warm-up row was ever filled. The keyboard
# is dismissed with the numeric toolbar's Done key because MAUI does not expose hideKeyboard.
- scrollUntilVisible:
    element:
      id: "${QA_SET_PREFIX}Weight"
    direction: DOWN
    speed: 25
    visibilityPercentage: 50
    centerElement: false
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "${QA_SET_PREFIX}Weight"
    commands:
      - tapOn:
          id: "${QA_SET_PREFIX}Weight"
      - eraseText: 5
      - inputText: "20"
      - takeScreenshot: 11b_numeric_keyboard
      - runFlow:
          when:
            visible: "^Done$|^Готово$"
          commands:
            - tapOn: "^Done$|^Готово$"
- runFlow:
    when:
      visible:
        id: "${QA_SET_PREFIX}Reps"
    commands:
      - tapOn:
          id: "${QA_SET_PREFIX}Reps"
      - eraseText: 5
      - inputText: "10"
      - runFlow:
          when:
            visible: "^Done$|^Готово$"
          commands:
            - tapOn: "^Done$|^Готово$"
- runFlow:
    when:
      visible:
        id: "${QA_SET_PREFIX}LeftReps"
    commands:
      - tapOn:
          id: "${QA_SET_PREFIX}LeftReps"
      - eraseText: 5
      - inputText: "10"
      - runFlow:
          when:
            visible: "^Done$|^Готово$"
          commands:
            - tapOn: "^Done$|^Готово$"
- runFlow:
    when:
      visible:
        id: "${QA_SET_PREFIX}RightReps"
    commands:
      - tapOn:
          id: "${QA_SET_PREFIX}RightReps"
      - eraseText: 5
      - inputText: "10"
      - runFlow:
          when:
            visible: "^Done$|^Готово$"
          commands:
            - tapOn: "^Done$|^Готово$"
