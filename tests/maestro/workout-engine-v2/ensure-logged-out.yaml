appId: com.musclecuties.app
---
- runFlow:
    when:
      visible: "Allow|Разрешить"
    commands:
      - tapOn: "Allow|Разрешить"
- runFlow:
    when:
      visible: "You|Профиль"
    commands:
      - runFlow:
          when:
            visible: "Allow|Разрешить"
          commands:
            - tapOn: "Allow|Разрешить"
      - tapOn: "You|Профиль"
      - extendedWaitUntil:
          visible: "Member since.*|В приложении с.*|PRIVATE VAULT|ЛИЧНЫЙ АРХИВ"
          timeout: 15000
      - scrollUntilVisible:
          element: "Log Out|Выйти"
          direction: DOWN
          timeout: 20000
      - tapOn: "Log Out|Выйти"
      - runFlow:
          when:
            visible: "Are you sure.*|Вы уверены.*"
          commands:
            - tapOn:
                text: "Log out|Выйти"
                below: "Are you sure.*|Вы уверены.*"
                rightOf: "Cancel|Отмена"
- extendedWaitUntil:
    visible:
      id: LoginEmail
    timeout: 30000
- takeScreenshot: 01_login
