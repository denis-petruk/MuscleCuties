appId: com.musclecuties.app
---
# Log the visible exercise. Set composition varies (some movements have no warm-up row, a unilateral
# movement may prescribe two working sets), so each row is logged only when it exists. Warm-up and
# working rows carry per-kind automation ids, so a warm-up no longer renames the first working row.
# A background event can return a resumed session to its intro; Start resumes the same session.
- runFlow:
    when:
      visible:
        id: WorkoutSessionStartButton
    commands:
      - tapOn:
          id: WorkoutSessionStartButton
      - extendedWaitUntil:
          visible:
            id: WorkoutSessionNextExerciseButton
          timeout: 15000
- runFlow:
    when:
      visible:
        id: WorkoutSessionNextExerciseButton
    commands:
      - repeat:
          times: 4
          commands:
            - swipe:
                start: "50%,58%"
                end: "50%,88%"
                duration: 300
      - scrollUntilVisible:
          element:
            id: "(WarmupSet1|WorkingSet1)(Reps|LeftReps)"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - runFlow:
          file: log-set.yaml
          env:
            QA_SET_PREFIX: WarmupSet1
      - scrollUntilVisible:
          element:
            id: "(WorkingSet1|WorkingSet2)(Reps|LeftReps)"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - runFlow:
          file: log-set.yaml
          env:
            QA_SET_PREFIX: WorkingSet1
      - swipe:
          start: "50%,75%"
          end: "50%,55%"
          duration: 300
      - runFlow:
          when:
            visible:
              id: "WorkingSet2(Reps|LeftReps)"
          commands:
            - runFlow:
                file: log-set.yaml
                env:
                  QA_SET_PREFIX: WorkingSet2
      - swipe:
          start: "50%,75%"
          end: "50%,55%"
          duration: 300
      - runFlow:
          when:
            visible:
              id: "WorkingSet3(Reps|LeftReps)"
          commands:
            - runFlow:
                file: log-set.yaml
                env:
                  QA_SET_PREFIX: WorkingSet3
      - runFlow:
          when:
            visible: "^Done$|^Готово$"
          commands:
            - tapOn: "^Done$|^Готово$"
      - runFlow:
          when:
            notVisible:
              id: WorkoutSessionNextExerciseButton
          commands:
            - hideKeyboard
      # The guard is evaluated before the last Next navigates to the summary; the tap then finds
      # no button and must not fail the run, because the completion button below proves the state.
      - tapOn:
          id: WorkoutSessionNextExerciseButton
          optional: true
