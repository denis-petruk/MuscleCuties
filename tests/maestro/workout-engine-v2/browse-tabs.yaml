appId: com.musclecuties.app
---
- tapOn: "Cycle|Цикл"
- extendedWaitUntil:
    visible: "Your cycle|Ваш цикл"
    timeout: 20000
- takeScreenshot: 08_cycle
- scrollUntilVisible:
    element:
      id: CycleMonthToggle
    direction: DOWN
    timeout: 20000
- takeScreenshot: 08b_cycle_calendar
- tapOn: "Nutrition|Питание"
- extendedWaitUntil:
    visible: "Nutrition|Питание"
    timeout: 20000
- takeScreenshot: 13_nutrition
- tapOn: "You|Профиль"
- extendedWaitUntil:
    visible: "Member since.*|В приложении с.*"
    timeout: 20000
- takeScreenshot: 15_profile
- scrollUntilVisible:
    element: "Workout Availability|Доступность для тренировок"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 15b_profile_settings
