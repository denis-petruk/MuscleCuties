appId: com.musclecuties.app
---
- tapOn: "Complete check-in|Заполнить отметку|Пройти отметку"
- extendedWaitUntil:
    visible:
      id: SleepQualityChip3
    timeout: 15000
- runFlow:
    when:
      visible: "Not now|Не сейчас"
    commands:
      - tapOn: "Not now|Не сейчас"
- scrollUntilVisible:
    element:
      id: SleepQualityChip3
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: SleepQualityChip3
- scrollUntilVisible:
    element:
      id: EnergyChip3
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: EnergyChip3
- scrollUntilVisible:
    element:
      id: FatigueChip1
    direction: DOWN
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 20000
- runFlow:
    when:
      visible: "Not now|Не сейчас"
    commands:
      - tapOn: "Not now|Не сейчас"
- tapOn:
    id: FatigueChip1
- assertNotVisible:
    id: SorenessChip3
- assertVisible:
    id: CheckInSaveButton
    enabled: true
- takeScreenshot: 07_daily_checkin
- tapOn:
    id: CheckInSaveButton
- extendedWaitUntil:
    notVisible:
      id: CheckInSaveButton
    timeout: 30000
