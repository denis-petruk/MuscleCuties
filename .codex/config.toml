# MuscleCuties — lean single-agent Codex project configuration
# Routine default: economical model, low reasoning, single agent, no automatic memory/hooks/MCP bloat.
# Escalate per session via CLI flags (e.g., `codex -m gpt-6.2-sol -c model_reasoning_effort=high`) when needed.

model = "gpt-6.2-astra"
model_reasoning_effort = "low"
personality = "none"
web_search = "disabled"
tool_output_token_limit = 4000

[features]
multi_agent = false
memories = false
hooks = false

[memories]
generate_memories = false
use_memories = false

[skills]
include_instructions = false
max_context_tokens = 2000

[[skills.config]]
path = "/Users/denispetruk/.codex/skills/.system/imagegen/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/denispetruk/.codex/skills/.system/openai-docs/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/denispetruk/.codex/skills/.system/review-agent/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/denispetruk/.codex/skills/.system/skill-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/denispetruk/.codex/skills/.system/skill-installer/SKILL.md"
enabled = false

[plugins."browser@openai-bundled"]
enabled = false

[plugins."unified-computer-use@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."codex-app-tools@openai-bundled"]
enabled = false

[mcp_servers.aws-mcp]
enabled = false

[mcp_servers.chatcut]
enabled = false

[mcp_servers.node_repl]
enabled = false

[mcp_servers.computer-use]
enabled = false
