name: Mobile iOS Release

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment (beta only; no separate Staging API or database is provisioned)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
      target_runtime:
        description: 'Target runtime (device produces the .ipa for Transporter; simulator is verification only)'
        required: true
        default: 'device'
        type: choice
        options:
          - device
          - simulator
      build_configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build_ios:
    name: build_ios_${{ inputs.target_environment }}_${{ inputs.target_runtime }}
    # .NET for iOS 27.1 requires Xcode 27, which only the xcode-27 image provides.
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK 10.0.403 for Xcode 27.1
        uses: actions/setup-dotnet@v4
        with:
          # Workload set 10.0.403 selects .NET for iOS 27.1.10018, the
          # supported pairing for the xcode-27 image's Xcode 27.1.
          # The repository global.json still selects the local 10.0.2xx
          # band; latestFeature resolves this explicitly installed 4xx SDK.
          dotnet-version: 10.0.403

      - name: Install MAUI iOS workload
        run: |
          dotnet workload install maui-ios --version 10.0.403

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Resolve runtime identifier
        id: runtime
        run: |
          if [ "${{ inputs.target_runtime }}" = "device" ]; then
            echo "rid=ios-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "rid=iossimulator-arm64" >> "$GITHUB_OUTPUT"
          fi

      # A device build publishes a signed .ipa, which is the only artefact Transporter accepts.
      # BuildIpa is disabled only for Debug in the project file, so Release publishes an .ipa.
      - name: Build MAUI iOS client and produce the .ipa
        if: inputs.target_runtime == 'device'
        run: |
          dotnet publish src/MuscleCuties.UI/MuscleCuties.UI.csproj \
            -f net10.0-ios \
            -c ${{ inputs.build_configuration }} \
            -p:AppTargetEnvironment=${{ inputs.target_environment }} \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:BuildIpa=true

      - name: Build MAUI iOS client (simulator, verification only)
        if: inputs.target_runtime == 'simulator'
        run: |
          dotnet build src/MuscleCuties.UI/MuscleCuties.UI.csproj \
            -f net10.0-ios \
            -c ${{ inputs.build_configuration }} \
            -p:AppTargetEnvironment=${{ inputs.target_environment }} \
            -p:RuntimeIdentifier=iossimulator-arm64

      - name: Collect the .ipa for Transporter
        id: ipa
        if: inputs.target_runtime == 'device'
        run: |
          ipa="$(find src/MuscleCuties.UI/bin -name '*.ipa' -type f -print -quit)"
          if [ -z "$ipa" ]; then
            echo "The device build produced no .ipa."
            echo "An .ipa for Transporter needs an Apple Distribution signing identity and"
            echo "provisioning profile available on this runner; an unsigned build cannot be"
            echo "uploaded. Install them on the xcode-27 runner, or build and export the .ipa"
            echo "locally and upload it yourself."
            exit 1
          fi
          out="MuscleCuties-${{ inputs.target_environment }}-${{ github.sha }}.ipa"
          cp "$ipa" "$out"
          shasum -a 256 "$out" | tee "$out.sha256"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload the .ipa for Transporter
        if: inputs.target_runtime == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: musclecuties-ios-ipa-${{ inputs.target_environment }}-${{ github.sha }}
          path: |
            ${{ steps.ipa.outputs.path }}
            ${{ steps.ipa.outputs.path }}.sha256
          retention-days: 30

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: musclecuties-ios-${{ inputs.target_environment }}-${{ steps.runtime.outputs.rid }}-${{ github.sha }}
          path: src/MuscleCuties.UI/bin/${{ inputs.build_configuration }}/net10.0-ios/${{ steps.runtime.outputs.rid }}/
          retention-days: 30
