name: Mobile iOS Build Verification

# The signed .ipa that goes to Transporter is built on the owner's Mac with the command in
# docs/mobile/ipa-for-transporter.md. CI deliberately does not attempt it: MAUI cannot produce a
# signable .ipa without an Apple Distribution identity and provisioning profile on the runner,
# and an unsigned .ipa cannot be uploaded at all. Failing every run for a missing identity would
# be noise, so this workflow only proves the iOS app still compiles.

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment (beta only; no separate Staging API or database is provisioned)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
      build_configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build_ios:
    name: build_ios_${{ inputs.target_environment }}_simulator
    # .NET for iOS 27.1 requires Xcode 27, which only the xcode-27 image provides.
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK 10.0.403 for Xcode 27.1
        uses: actions/setup-dotnet@v4
        with:
          # Workload set 10.0.403 selects .NET for iOS 27.1.10018, the
          # supported pairing for the xcode-27 image's Xcode 27.1.
          # The repository global.json still selects the local 10.0.2xx
          # band; latestFeature resolves this explicitly installed 4xx SDK.
          dotnet-version: 10.0.403

      - name: Install MAUI iOS workload
        run: |
          dotnet workload install maui-ios --version 10.0.403

      - name: Report Xcode version
        run: xcodebuild -version

      # Simulator builds are never code signed, so this step cannot fail for want of an Apple
      # identity. It still compiles the iOS platform code, XAML and the Release AOT path.
      - name: Build MAUI iOS client (simulator)
        run: |
          dotnet build src/MuscleCuties.UI/MuscleCuties.UI.csproj \
            -f net10.0-ios \
            -c ${{ inputs.build_configuration }} \
            -p:AppTargetEnvironment=${{ inputs.target_environment }} \
            -p:RuntimeIdentifier=iossimulator-arm64

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: musclecuties-ios-${{ inputs.target_environment }}-iossimulator-arm64-${{ github.sha }}
          path: src/MuscleCuties.UI/bin/${{ inputs.build_configuration }}/net10.0-ios/iossimulator-arm64/
          retention-days: 30
