name: iOS Release (TestFlight)

# Builds the signed .ipa and uploads it to TestFlight. ci.yml calls this workflow after its
# `required` gate on a push to main; it can also be run from the Actions tab. The Apple
# Distribution identity, the App Store provisioning profile and the App Store Connect API key are
# imported from repository secrets and destroyed afterwards — no signing material lives in this
# repository. See docs/mobile/ipa-for-transporter.md, "Automated release".

on:
  workflow_call:
    inputs:
      target_environment:
        description: 'Target environment (beta only; no separate Staging API or database is provisioned)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment (beta only; no separate Staging API or database is provisioned)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  release_ios:
    name: release_ios_${{ inputs.target_environment }}
    if: github.ref == 'refs/heads/main'
    # .NET for iOS 27.1 requires Xcode 27, which only the arm64 xcode-27 image provides.
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      # ci.yml skips this workflow when the Apple secrets are absent, but a manual dispatch has no
      # gate in front of it: name every missing secret here, before any work starts, instead of
      # failing at the first step that needs one.
      - name: Check the TestFlight secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          missing=""
          for name in IOS_DISTRIBUTION_CERTIFICATE_P12 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
                      IOS_PROVISIONING_PROFILE ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then
            exit 0
          fi
          {
            echo "### TestFlight upload blocked"
            echo
            echo "This run cannot release because these repository secrets are not set:"
            echo
            for name in $missing; do
              echo "- \`$name\`"
            done
            echo
            echo "Add them under Settings → Secrets and variables → Actions (commands in"
            echo "\`docs/mobile/ipa-for-transporter.md\` §6), then run this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::TestFlight upload blocked, missing secrets:${missing}"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK 10.0.403 for Xcode 27.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # Workload set 10.0.403 selects .NET for iOS 27.1.10018, the supported pairing for the
          # xcode-27 image's Xcode 27.1. The repository global.json still selects the local 10.0.2xx
          # band; latestFeature resolves this explicitly installed 4xx SDK.
          dotnet-version: 10.0.403

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.403

      # Only this temporary keychain is searched, so codesign can only pick the imported identity
      # and never a runner- or machine-wide certificate.
      - name: Import the distribution identity
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$password" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/distribution.p12"
          p12="$RUNNER_TEMP/distribution.p12"
          # An empty secret decodes to an empty file, and security import then fails with a
          # message that never names the secret, so both conditions are checked before import.
          if [ ! -s "$p12" ]; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_P12 decoded to an empty file; the secret is set but has no content." >&2
            exit 1
          fi
          # A PKCS#12 container is a DER SEQUENCE, so its first byte is 0x30. Checking that before
          # openssl separates "the secret holds something that is not a .p12 at all" (a path, a PEM
          # certificate, a line-wrapped base64 block) from "the password does not open a real .p12",
          # which need different secrets replaced.
          if [ "$(od -An -tx1 -N1 "$p12" | tr -d ' \n')" != "30" ]; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_P12 does not decode to a PKCS#12 container: its first byte is not 0x30. Store the single-line base64 of the exported Apple Distribution .p12, not a path, a PEM certificate or a wrapped base64 block." >&2
            exit 1
          fi
          # openssl never echoes key material and its own wording is the only thing that tells the
          # remaining causes apart, so its message is kept instead of being sent to /dev/null.
          # A parse failure is not proof that the secret is bad, though: the runner's /usr/bin/openssl
          # is LibreSSL, which cannot read the PBES2/AES container Keychain's export produces. Only
          # the password complaint is decisive here; `security import` below decides the rest.
          if ! openssl_error="$(openssl pkcs12 -in "$p12" -noout -passin "env:CERTIFICATE_PASSWORD" 2>&1)"; then
            detail="$(printf '%s\n' "$openssl_error" | head -1)"
            [ -n "$detail" ] || detail="no diagnostic output"
            case "$detail" in
              *"ac verify"*|*"nvalid password"*)
                echo "::error::IOS_DISTRIBUTION_CERTIFICATE_PASSWORD does not open IOS_DISTRIBUTION_CERTIFICATE_P12 (openssl: $detail). Both secrets come from the same export; set them together." >&2
                exit 1
                ;;
              *)
                echo "::notice::openssl cannot read this .p12 ($detail); LibreSSL does not parse PBES2/AES exports. security import below decides whether the identity is usable."
                ;;
            esac
          else
            # Non-secret metadata only: the identity and the date it stops being usable.
            openssl pkcs12 -in "$p12" -clcerts -nokeys -passin "env:CERTIFICATE_PASSWORD" \
              | openssl x509 -noout -subject -enddate
            if ! openssl pkcs12 -in "$p12" -clcerts -nokeys -passin "env:CERTIFICATE_PASSWORD" \
              | openssl x509 -noout -checkend 0; then
              echo "::error::The distribution certificate has expired; export a current Apple Distribution identity and update both certificate secrets." >&2
              exit 1
            fi
          fi
          if ! import_error="$(security import "$p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign 2>&1)"; then
            printf '%s\n' "$import_error" >&2
            echo "::error::security import could not add IOS_DISTRIBUTION_CERTIFICATE_P12 to the keychain. The secret must be the single-line base64 of the Apple Distribution .p12 itself, opened by IOS_DISTRIBUTION_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/distribution.p12"
          # An import that leaves no valid identity — expired, revoked or not a distribution
          # identity — cannot sign, so it is reported here instead of at the build.
          identities="$(security find-identity -v -p codesigning "$keychain")"
          printf '%s\n' "$identities"
          if printf '%s\n' "$identities" | grep -q " 0 valid identities found"; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_P12 imported no valid Apple Distribution identity: the certificate is expired, revoked, or the secret does not hold a distribution identity." >&2
            exit 1
          fi

      - name: Install the App Store provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE" | openssl base64 -d -A -out "$RUNNER_TEMP/release.mobileprovision"
          uuid="$(security cms -D -i "$RUNNER_TEMP/release.mobileprovision" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/release.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Stage the App Store Connect API key
        env:
          KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$KEY" | openssl base64 -d -A -out "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8"
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP/private_keys" >> "$GITHUB_ENV"

      # App Store Connect rejects a build number it already holds for version 1.0, so the commit
      # number alone cannot be reused across releases: the UTC timestamp is unique per upload and
      # increases monotonically (YYYYMMDD.SSSSSS).
      - name: Build the signed .ipa
        run: |
          set -euo pipefail
          build_number="$(date -u +%Y%m%d).$(date -u +%H%M%S)"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          dotnet publish src/MuscleCuties.UI/MuscleCuties.UI.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:AppTargetEnvironment=${{ inputs.target_environment }} \
            -p:ApplicationVersion="$build_number" \
            -p:BuildIpa=true \
            -p:CodesignProvision="$PROFILE_UUID"

      - name: Verify the signature before upload
        run: |
          set -euo pipefail
          ipa=src/MuscleCuties.UI/bin/Release/net10.0-ios/ios-arm64/publish/MuscleCuties.UI.ipa
          if [ ! -f "$ipa" ]; then
            echo "the signed .ipa was not produced at $ipa" >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipa"
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app="$RUNNER_TEMP/ipa/Payload/MuscleCuties.UI.app"
          codesign --verify --deep --strict "$app"
          if codesign -dvvv "$app" 2>&1 | grep -q "Certificate Revoked"; then
            echo "the imported distribution certificate is revoked" >&2
            exit 1
          fi
          test "$(plutil -extract CFBundleVersion raw "$app/Info.plist")" = "$BUILD_NUMBER"
          shasum -a 256 "$ipa"

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f src/MuscleCuties.UI/bin/Release/net10.0-ios/ios-arm64/publish/MuscleCuties.UI.ipa \
            -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" 2>&1 \
            | tee -a "$RUNNER_TEMP/altool.log"

      # App Store Connect processes an upload asynchronously. Wait for the build to become VALID
      # and add it to the tester groups before the API key below is deleted. Without
      # TESTFLIGHT_GROUP every internal group is targeted; name one group to narrow that.
      - name: Assign the build to TestFlight testers
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_GROUP }}
        run: |
          set -euo pipefail
          args=(--key "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
                --key-id "$ASC_API_KEY_ID"
                --issuer "$ASC_API_ISSUER_ID"
                --build-number "$BUILD_NUMBER")
          if [ -n "${TESTFLIGHT_GROUP:-}" ]; then
            args+=(--group "$TESTFLIGHT_GROUP")
          fi
          python3 tools/deployment/assign_testflight_build.py "${args[@]}"

      - name: Remove the signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/ipa" \
            "$RUNNER_TEMP/release.mobileprovision" "$RUNNER_TEMP/altool.log"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
