name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'platform/**'
      - 'product/**'
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify_source:
    name: verify_source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Verify SDK and restore Server
        run: |
          dotnet restore services/MuscleCuties.Server/MuscleCuties.Server.csproj
          dotnet build services/MuscleCuties.Server/MuscleCuties.Server.csproj --configuration Release --no-restore

      - name: Build remaining non-UI projects
        run: |
          for proj in \
            src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj \
            src/MuscleCuties.Infrastructure.PostgreSql/MuscleCuties.Infrastructure.PostgreSql.csproj \
            src/MuscleCuties.UseCases/MuscleCuties.UseCases.csproj; do
            dotnet build "$proj" --configuration Release
          done

      - name: Dependency vulnerability scan (non-UI projects)
        run: |
          status=0
          for proj in \
            services/MuscleCuties.Server/MuscleCuties.Server.csproj \
            src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj \
            src/MuscleCuties.Infrastructure/MuscleCuties.Infrastructure.csproj \
            src/MuscleCuties.Infrastructure.PostgreSql/MuscleCuties.Infrastructure.PostgreSql.csproj \
            src/MuscleCuties.UseCases/MuscleCuties.UseCases.csproj \
            src/MuscleCuties.Core/MuscleCuties.Core.csproj \
            src/MuscleCuties.Contracts/MuscleCuties.Contracts.csproj; do
            echo "== $proj"
            dotnet list "$proj" package --vulnerable --include-transitive 2>&1 | tee "$RUNNER_TEMP/vuln.txt"
            if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vuln.txt"; then
              status=1
            fi
          done
          exit $status

  verify_tests:
    name: verify_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install Lambda Tools
        run: |
          dotnet tool install Amazon.Lambda.Tools --version 7.0.0 --tool-path .tools

      - name: Run deployment offline tests
        run: |
          python3 tests/MuscleCuties.Deployment.Tests/test_package_upload.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/MuscleCuties.Deployment.Tests -p 'test_deploy_release.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/MuscleCuties.Deployment.Tests -p 'test_testflight_assignment.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/MuscleCuties.Deployment.Tests -p 'test_oidc_policy.py'

      - name: Run Core tests
        run: |
          dotnet test tests/MuscleCuties.Core.Tests/MuscleCuties.Core.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=core-tests.trx" \
            --results-directory test-results

      - name: Run Mobile Contracts tests
        run: |
          dotnet test tests/MuscleCuties.Mobile.Contracts.Tests/MuscleCuties.Mobile.Contracts.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=mobile-contracts-tests.trx" \
            --results-directory test-results

      - name: Run Registration tests
        run: |
          dotnet test tests/MuscleCuties.Registration.Tests/MuscleCuties.Registration.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=registration-tests.trx" \
            --results-directory test-results

      - name: Run Server tests
        run: |
          dotnet test tests/MuscleCuties.Server.Tests/MuscleCuties.Server.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=server-tests.trx" \
            --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 30

  # Workflow and deployment-script edits are a restricted path, so the static gate runs in CI
  # instead of relying on a manual `tools/deployment/lint-workflows.sh` before each merge.
  verify_static:
    name: verify_static
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint "${RUNNER_TEMP}/actionlint"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Lint every workflow
        run: bash tools/deployment/lint-workflows.sh

  verify_ios_compile:
    name: verify_ios_compile
    # The maui-ios workload resolves to .NET for iOS 27.1, which refuses to build without
    # Xcode 27. The macos-15 image only ships Xcode 16.x, so the job runs on the Xcode 27
    # image instead (arm64 only; see actions/runner-images xcode-27-arm64).
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK 10.0.403 for Xcode 27.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # Workload set 10.0.403 selects .NET for iOS 27.1.10018, the
          # supported pairing for the xcode-27 image's Xcode 27.1.
          # The repository global.json still selects the local 10.0.2xx
          # band; latestFeature resolves this explicitly installed 4xx SDK.
          dotnet-version: 10.0.403

      - name: Install MAUI iOS workload
        run: |
          dotnet workload install maui-ios --version 10.0.403

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Compile iOS app (simulator, unsigned)
        run: |
          dotnet build src/MuscleCuties.UI/MuscleCuties.UI.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=iossimulator-arm64

  postgres_verify:
    name: postgres_verify
    uses: ./.github/workflows/db-verify.yml

  required:
    name: required
    needs: [verify_source, verify_tests, verify_static, verify_ios_compile, postgres_verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate required check results
        run: |
          if [ "${{ needs.verify_source.result }}" != "success" ]; then
            echo "verify_source failed: ${{ needs.verify_source.result }}"
            exit 1
          fi
          if [ "${{ needs.verify_tests.result }}" != "success" ]; then
            echo "verify_tests failed: ${{ needs.verify_tests.result }}"
            exit 1
          fi
          if [ "${{ needs.verify_ios_compile.result }}" != "success" ]; then
            echo "verify_ios_compile failed: ${{ needs.verify_ios_compile.result }}"
            exit 1
          fi
          if [ "${{ needs.postgres_verify.result }}" != "success" ]; then
            echo "postgres_verify failed: ${{ needs.postgres_verify.result }}"
            exit 1
          fi
          if [ "${{ needs.verify_static.result }}" != "success" ]; then
            echo "verify_static failed: ${{ needs.verify_static.result }}"
            exit 1
          fi
          echo "All required checks passed successfully."

  # Everything below runs only from main and only after `required` succeeded, so a push that fails
  # any test, build or database check cannot reach a target.

  # A job-level `if` cannot read secrets, so the presence of the six Apple secrets is decided in a
  # step and published as an output. When any is missing the iOS release is skipped with a notice
  # in the run summary; the Lambda release below never waits on this job.
  release_ios_precondition:
    name: release_ios_precondition
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check the TestFlight secrets
        id: secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          missing=""
          for name in IOS_DISTRIBUTION_CERTIFICATE_P12 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
                      IOS_PROVISIONING_PROFILE ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "### TestFlight upload skipped"
            echo
            echo "The iOS release did not run because these repository secrets are not set:"
            echo
            for name in $missing; do
              echo "- \`$name\`"
            done
            echo
            echo "Add them under Settings → Secrets and variables → Actions (commands in"
            echo "\`docs/mobile/ipa-for-transporter.md\` §6), then push to \`main\` again. The Lambda"
            echo "release ran normally."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::TestFlight upload skipped, missing secrets:${missing}"

  # Both release jobs are reusable workflows, so the manual (workflow_dispatch) path and this
  # automatic one execute exactly the same steps.
  release_backend_beta:
    name: release_backend_beta
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: mutation-beta
      cancel-in-progress: false
    uses: ./.github/workflows/backend-release.yml
    secrets: inherit
    with:
      target_environment: beta
      mode: deploy

  release_ios_testflight:
    name: release_ios_testflight
    needs: [required, release_ios_precondition]
    # The gate resolves the secrets; this job exists only when all six are present, so a missing
    # secret shows up as a skipped job rather than a green run that uploaded nothing.
    if: needs.release_ios_precondition.outputs.ready == 'true'
    permissions:
      contents: read
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    uses: ./.github/workflows/mobile-release.yml
    secrets: inherit
    with:
      target_environment: beta
