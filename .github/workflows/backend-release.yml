name: Backend Release & Deployment

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment (Beta only; Staging is not provisioned as a separate API)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
      mode:
        description: 'Deploy the candidate, or roll both aliases back to the versions recorded in a deployment report'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      report_run_id:
        description: 'Rollback only: workflow run id that produced beta-deployment-report-<sha>'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read
  # Rollback reads the deployment report artifact produced by an earlier run.
  actions: read

concurrency:
  group: mutation-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    if: inputs.mode == 'deploy'
    uses: ./.github/workflows/backend-build.yml

  upload_artifacts:
    name: upload_artifacts
    needs: package
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::028417007003:role/MuscleCuties-GitHubActions-ArtifactUpload
          aws-region: us-east-2
          role-session-name: github-actions-artifact-upload-${{ github.run_id }}

      - name: Upload Server Lambda artifact to immutable S3 bucket
        env:
          AWS_RELEASE_BUCKET: musclecuties-release-artifacts-028417007003
          AWS_REGION: us-east-2
          ARTIFACT_COMPONENT: MuscleCuties.Server
        run: |
          bash tools/deployment/upload-artifact.sh \
            artifacts/MuscleCuties.Server.zip \
            artifacts/build-manifest.json \
            artifacts/server-release-object.json

      - name: Upload Worker Lambda artifact to immutable S3 bucket
        env:
          AWS_RELEASE_BUCKET: musclecuties-release-artifacts-028417007003
          AWS_REGION: us-east-2
          ARTIFACT_COMPONENT: MuscleCuties.WorkoutReconciliation
        run: |
          bash tools/deployment/upload-artifact.sh \
            artifacts/MuscleCuties.WorkoutReconciliation.zip \
            artifacts/worker-build-manifest.json \
            artifacts/worker-release-object.json

      - name: Upload release object manifests
        uses: actions/upload-artifact@v4
        with:
          name: release-object-${{ github.sha }}
          path: |
            artifacts/server-release-object.json
            artifacts/worker-release-object.json

  deploy_beta:
    name: deploy_beta
    needs: [package, upload_artifacts]
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts

      - name: Download release objects
        uses: actions/download-artifact@v4
        with:
          name: release-object-${{ github.sha }}
          path: artifacts

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::028417007003:role/MuscleCuties-GitHubActions-BetaDeploy
          aws-region: us-east-2
          role-session-name: github-actions-beta-deploy-${{ github.run_id }}

      # Required repository/environment variables:
      #   BETA_SERVER_FUNCTION, BETA_WORKER_FUNCTION
      #   BETA_SERVER_ALIAS, BETA_WORKER_ALIAS (aliases are required so rollback has a target)
      #   BETA_API_ENDPOINT (optional; when set, /health/live and /health/ready must return 200)
      #   AWS_ACCOUNT_ID (optional; when set, STS identity must match)
      # The report is written only after each serving CodeSha256 matches the candidate digests.
      - name: Deploy and verify both Lambda functions
        env:
          TARGET_ENV: beta
          AWS_REGION: us-east-2
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          SERVER_FUNCTION: ${{ vars.BETA_SERVER_FUNCTION }}
          SERVER_ALIAS: ${{ vars.BETA_SERVER_ALIAS }}
          WORKER_FUNCTION: ${{ vars.BETA_WORKER_FUNCTION }}
          WORKER_ALIAS: ${{ vars.BETA_WORKER_ALIAS }}
          SERVER_ZIP: artifacts/MuscleCuties.Server.zip
          SERVER_MANIFEST: artifacts/build-manifest.json
          SERVER_OBJECT: artifacts/server-release-object.json
          WORKER_ZIP: artifacts/MuscleCuties.WorkoutReconciliation.zip
          WORKER_MANIFEST: artifacts/worker-build-manifest.json
          WORKER_OBJECT: artifacts/worker-release-object.json
          REPORT_PATH: artifacts/deployment-report.json
          HEALTH_URL: ${{ vars.BETA_API_ENDPOINT }}
        run: |
          python3 tools/deployment/deploy_release.py deploy

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-deployment-report-${{ github.sha }}
          path: artifacts/deployment-report.json
          if-no-files-found: warn

  rollback_beta:
    name: rollback_beta
    if: inputs.mode == 'rollback'
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require the report run id
        run: |
          if [ -z "${{ inputs.report_run_id }}" ]; then
            echo "report_run_id is required to roll back: it identifies the deployment report whose previous alias versions are restored."
            exit 1
          fi

      # The report carries the previous alias version and digest for each function. Rollback
      # refuses to run without those recorded targets rather than guessing.
      - name: Download the deployment report from that run
        uses: actions/download-artifact@v4
        with:
          pattern: beta-deployment-report-*
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.report_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::028417007003:role/MuscleCuties-GitHubActions-BetaDeploy
          aws-region: us-east-2
          role-session-name: github-actions-beta-rollback-${{ github.run_id }}

      - name: Roll both aliases back and verify the restored digests
        env:
          TARGET_ENV: beta
          AWS_REGION: us-east-2
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          REPORT_PATH: artifacts/deployment-report.json
        run: |
          python3 tools/deployment/deploy_release.py rollback

      - name: Upload rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-rollback-report-${{ github.run_id }}
          path: artifacts/deployment-report.json
          if-no-files-found: warn
