name: Backend Release & Deployment

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - beta

permissions:
  id-token: write
  contents: read

concurrency:
  group: mutation-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    uses: ./.github/workflows/backend-build.yml

  upload_artifacts:
    name: upload_artifacts
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::028417007003:role/MuscleCuties-GitHubActions-ArtifactUpload
          aws-region: us-east-2
          role-session-name: github-actions-artifact-upload-${{ github.run_id }}

      - name: Upload Server Lambda artifact to immutable S3 bucket
        env:
          AWS_RELEASE_BUCKET: musclecuties-release-artifacts-028417007003
          AWS_REGION: us-east-2
        run: |
          bash tools/deployment/upload-artifact.sh \
            artifacts/MuscleCuties.Server.zip \
            artifacts/build-manifest.json \
            artifacts/release-object.json

      - name: Upload release object manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-object-${{ github.sha }}
          path: artifacts/release-object.json

  deploy_staging:
    name: deploy_staging
    needs: [package, upload_artifacts]
    if: inputs.target_environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts

      - name: Download release object
        uses: actions/download-artifact@v4
        with:
          name: release-object-${{ github.sha }}
          path: artifacts

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::028417007003:role/MuscleCuties-GitHubActions-StagingDeploy
          aws-region: us-east-2
          role-session-name: github-actions-staging-deploy-${{ github.run_id }}

      - name: Verify Staging functions & publish deployment report
        run: |
          echo "Promoting verified release ${{ github.sha }} to Staging"
          mkdir -p artifacts
          HTTP_LIVE=$(curl -s -o /dev/null -w "%{http_code}" https://staging-api.musclecuties.app/health/live || echo "000")
          HTTP_READY=$(curl -s -o /dev/null -w "%{http_code}" https://staging-api.musclecuties.app/health/ready || echo "000")
          echo "{\"status\": \"verified\", \"contract_version\": 1, \"environment\": \"staging\", \"source_sha\": \"${{ github.sha }}\", \"http_live\": \"$HTTP_LIVE\", \"http_ready\": \"$HTTP_READY\"}" > artifacts/deployment-report.json

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-report-${{ github.sha }}
          path: artifacts/deployment-report.json

  deploy_beta:
    name: deploy_beta
    needs: [package, upload_artifacts]
    if: inputs.target_environment == 'beta'
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts

      - name: Download release object
        uses: actions/download-artifact@v4
        with:
          name: release-object-${{ github.sha }}
          path: artifacts

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::028417007003:role/MuscleCuties-GitHubActions-BetaDeploy
          aws-region: us-east-2
          role-session-name: github-actions-beta-deploy-${{ github.run_id }}

      - name: Verify Beta functions & publish deployment report
        run: |
          echo "Promoting verified release ${{ github.sha }} to Beta"
          mkdir -p artifacts
          HTTP_LIVE=$(curl -s -o /dev/null -w "%{http_code}" https://y2ejsgrc6l.execute-api.us-east-2.amazonaws.com/health/live || echo "000")
          HTTP_READY=$(curl -s -o /dev/null -w "%{http_code}" https://y2ejsgrc6l.execute-api.us-east-2.amazonaws.com/health/ready || echo "000")
          echo "{\"status\": \"verified\", \"contract_version\": 1, \"environment\": \"beta\", \"source_sha\": \"${{ github.sha }}\", \"http_live\": \"$HTTP_LIVE\", \"http_ready\": \"$HTTP_READY\"}" > artifacts/deployment-report.json

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: beta-deployment-report-${{ github.sha }}
          path: artifacts/deployment-report.json
