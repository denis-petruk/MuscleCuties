name: Backend Release & Deployment

# Called by ci.yml after its `required` gate on a push to main, and runnable from the Actions tab.
on:
  workflow_call:
    inputs:
      target_environment:
        description: 'Target deployment environment (Beta only; Staging is not provisioned as a separate API)'
        required: true
        type: string
      mode:
        description: 'Deploy the candidate, or roll both aliases back to the versions recorded in a deployment report'
        required: true
        type: string
      report_run_id:
        description: 'Rollback only: workflow run id that produced beta-deployment-report-<sha>'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment (Beta only; Staging is not provisioned as a separate API)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
      mode:
        description: 'Deploy the candidate, or roll both aliases back to the versions recorded in a deployment report'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      report_run_id:
        description: 'Rollback only: workflow run id that produced beta-deployment-report-<sha>'
        required: false
        default: ''

permissions:
  contents: read
  # Rollback reads the deployment report artifact produced by an earlier run.
  actions: read

concurrency:
  group: mutation-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    if: inputs.mode == 'deploy'
    uses: ./.github/workflows/backend-build.yml

  upload_artifacts:
    name: upload_artifacts
    needs: package
    if: inputs.mode == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download backend artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ARTIFACT_UPLOAD_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: github-actions-artifact-upload-${{ github.run_id }}

      - name: Upload Server Lambda artifact to immutable S3 bucket
        env:
          AWS_RELEASE_BUCKET: musclecuties-release-artifacts-028417007003
          AWS_REGION: us-east-2
          ARTIFACT_COMPONENT: Server
          # Must equal the component name deploy_release.py expects in the S3 key
          # prefix lambda/<component>/<source_sha>/<zip_sha256>/.
        run: |
          bash tools/deployment/upload-artifact.sh \
            artifacts/MuscleCuties.Server.zip \
            artifacts/build-manifest.json \
            artifacts/server-release-object.json

      - name: Upload release object manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-object-${{ github.sha }}
          path: artifacts/server-release-object.json

  deploy_beta:
    name: deploy_beta
    needs: [package, upload_artifacts]
    if: inputs.mode == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download backend artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts

      - name: Download release objects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-object-${{ github.sha }}
          path: artifacts

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_BETA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: github-actions-beta-deploy-${{ github.run_id }}

      # Required repository/environment variables:
      #   BETA_SERVER_FUNCTION, BETA_SERVER_ALIAS (an alias is required so rollback has a target)
      #   BETA_API_ENDPOINT (required; /health/live and /health/ready must return 200)
      #   AWS_ACCOUNT_ID (optional; when set, STS identity must match)
      # The report is written only after each serving CodeSha256 matches the candidate digests.
      - name: Require the smoke endpoint
        env:
          BETA_API_ENDPOINT: ${{ vars.BETA_API_ENDPOINT }}
        run: |
          if [ -z "$BETA_API_ENDPOINT" ]; then
            echo "BETA_API_ENDPOINT repository/environment variable is required: the post-deploy health smoke check cannot be skipped."
            exit 1
          fi

      # The readiness probe compares the deployed EF model with ops.schema_metadata, so cutting the
      # alias over a database that has not been migrated is a guaranteed partial release:
      # release_status=partial, code=health_check_failed_ready, recovery=manual_rollback_required.
      # The schema is checked with this release's own model before the first mutation, so a stale
      # database stops the job with nothing deployed and nothing to roll back.
      - name: Set up .NET SDK for the schema preflight
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Require the beta database to match this release's schema
        env:
          ConnectionStrings__PostgreSql: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          if [ -z "${ConnectionStrings__PostgreSql:-}" ]; then
            echo "::error::DATABASE_CONNECTION_STRING is not available to the beta deploy job, so the schema preflight cannot run. Restore the environment secret; the release is stopped before any mutation rather than skipping the check."
            exit 1
          fi
          dotnet build src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj --configuration Release
          status=0
          dotnet run --project src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj --configuration Release --no-build -- dbcheck || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::error::The beta database could not be reached from this job (dbcheck exit 3), so its schema was never compared. This is a connection or configuration failure, not schema drift: check DATABASE_CONNECTION_STRING, the trusted root certificate (certs/global-bundle.pem), the runner's network path to the RDS endpoint and the role. Do not run the migration workflow for this. The alias has not been moved."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::The beta database does not match this release's schema model (dbcheck exit $status). Run the 'Database Migration & Schema Release' workflow for beta, then re-run this release. The alias has not been moved."
            exit 1
          fi

      - name: Deploy and verify the configured Lambda functions
        env:
          TARGET_ENV: beta
          AWS_REGION: us-east-2
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          SERVER_FUNCTION: ${{ vars.BETA_SERVER_FUNCTION }}
          SERVER_ALIAS: ${{ vars.BETA_SERVER_ALIAS }}
          SERVER_ZIP: artifacts/MuscleCuties.Server.zip
          SERVER_MANIFEST: artifacts/build-manifest.json
          SERVER_OBJECT: artifacts/server-release-object.json
          REPORT_PATH: artifacts/deployment-report.json
          HEALTH_URL: ${{ vars.BETA_API_ENDPOINT }}
        run: |
          python3 tools/deployment/deploy_release.py deploy

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-deployment-report-${{ github.sha }}
          path: artifacts/deployment-report.json
          if-no-files-found: warn

  rollback_beta:
    name: rollback_beta
    if: inputs.mode == 'rollback' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require the report run id
        run: |
          if [ -z "${{ inputs.report_run_id }}" ]; then
            echo "report_run_id is required to roll back: it identifies the deployment report whose previous alias versions are restored."
            exit 1
          fi

      # The report carries the previous alias version and digest for each function. Rollback
      # refuses to run without those recorded targets rather than guessing.
      - name: Download the deployment report from that run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: beta-deployment-report-*
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.report_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_BETA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: github-actions-beta-rollback-${{ github.run_id }}

      - name: Roll the alias back and verify the restored digest
        env:
          TARGET_ENV: beta
          AWS_REGION: us-east-2
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          REPORT_PATH: artifacts/deployment-report.json
        run: |
          python3 tools/deployment/deploy_release.py rollback

      - name: Upload rollback report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-rollback-report-${{ github.run_id }}
          path: artifacts/deployment-report.json
          if-no-files-found: warn
