name: Latency gate

on:
  schedule:
    # Weekly, so a regression that never touches a merged PR still surfaces.
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'services/MuscleCuties.Server/**'
      - 'src/MuscleCuties.Infrastructure/**'
      - 'src/MuscleCuties.Infrastructure.PostgreSql/**'
      - 'src/MuscleCuties.DbMaintenance/**'
      - 'services/postgresql/**'
      - 'tests/MuscleCuties.Server.Tests/**'
      - 'docs/performance/server-latency-report.json'
      - '.github/workflows/latency-gate.yml'

permissions:
  contents: read

concurrency:
  group: latency-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latency_gate:
    name: latency_gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Provision disposable PostgreSQL schema
        env:
          ConnectionStrings__PostgreSql: 'Host=127.0.0.1;Database=mc_latency_gate;Username=postgres;Password=ci_disposable_only'
        run: |-
          sudo apt-get update && sudo apt-get install -y postgresql-client
          export PGPASSWORD='ci_disposable_only'
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE mc_latency_gate;"
          dotnet run --project src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj -c Release -- migrate
          dotnet run --project src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj -c Release --no-build -- seed

      - name: Run the all-route latency gate
        env:
          # Makes the gate's discovery-time skip condition false, so it executes instead of skipping.
          MC_LATENCY_POSTGRES: 'Host=127.0.0.1;Database=mc_latency_gate;Username=postgres;Password=ci_disposable_only'
        run: |-
          set -o pipefail
          dotnet test tests/MuscleCuties.Server.Tests/MuscleCuties.Server.Tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~EveryMappedRouteHasMeasuredColdAndWarmP95WithinBudget" \
            --logger "trx;LogFileName=latency-gate.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory test-results | tee latency-gate.log

      - name: Fail when the gate was skipped instead of executed
        if: always()
        run: |-
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ElementTree

          reports = glob.glob("test-results/**/*.trx", recursive=True)
          if not reports:
              sys.exit("Latency gate produced no trx result, so it never ran. Set MC_LATENCY_POSTGRES and provision PostgreSQL.")
          counters = ElementTree.parse(reports[0]).getroot().find(".//{*}Counters")
          if counters is None:
              sys.exit(f"Latency gate trx has no counters, so it cannot prove the gate ran: {reports[0]}")
          total = int(counters.get("total", "0"))
          executed = int(counters.get("executed", "0"))
          notExecuted = int(counters.get("notExecuted", "0"))
          print(f"latency gate: total={total} executed={executed} notExecuted={notExecuted}")
          if total != 1 or executed != 1 or notExecuted != 0:
              sys.exit("Latency gate was not measured: the test skipped instead of executing. "
                       "MC_LATENCY_POSTGRES must point at a reachable disposable PostgreSQL database.")
          PY

      - name: Upload latency gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-gate-results
          path: |
            test-results/
            latency-gate.log
          retention-days: 30
