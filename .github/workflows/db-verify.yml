name: Database Verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_postgres_compatibility:
    name: verify_postgres_compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Initialize disposable PostgreSQL databases
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          export PGPASSWORD='ci_disposable_only'
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE mc_test_nutrition_ci;"
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE mc_retry_disposable;"
          psql -h 127.0.0.1 -U postgres -d postgres -f services/postgresql/roles-and-grants.sql

      - name: Rehearse empty-database migration and seed
        env:
          ConnectionStrings__PostgreSql: 'Host=127.0.0.1;Database=mc_migration_rehearsal;Username=postgres;Password=ci_disposable_only'
        run: |
          export PGPASSWORD='ci_disposable_only'
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE mc_migration_rehearsal;"
          dotnet run --project src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj -c Release -- migrate
          dotnet run --project src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj -c Release --no-build -- seed
          dotnet run --project src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj -c Release --no-build -- dbcheck

      - name: Bootstrap disposable database schema
        env:
          ConnectionStrings__PostgreSql: 'Host=127.0.0.1;Database=mc_test_nutrition_ci;Username=postgres;Password=ci_disposable_only'
        run: |
          dotnet run --project src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj -c Release -- migrate
          dotnet run --project src/MuscleCuties.DbMaintenance/MuscleCuties.DbMaintenance.csproj -c Release --no-build -- seed
          # Grants name concrete relations, so they can only apply once the schema exists.
          export PGPASSWORD='ci_disposable_only'
          psql -h 127.0.0.1 -U postgres -d mc_test_nutrition_ci -v ON_ERROR_STOP=1 -f services/postgresql/roles-and-grants.sql

      - name: Setup restricted migrator and template database
        run: |
          export PGPASSWORD='ci_disposable_only'
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE mc_ci_migrator LOGIN PASSWORD 'ci_disposable_only' NOSUPERUSER NOBYPASSRLS CREATEROLE;"
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE mc_pg09_disposable TEMPLATE mc_test_nutrition_ci OWNER mc_ci_migrator;"
          psql -h 127.0.0.1 -U postgres -d mc_pg09_disposable -c "GRANT USAGE ON SCHEMA catalog TO mc_ci_migrator; GRANT SELECT ON ALL TABLES IN SCHEMA catalog TO mc_ci_migrator;"

      - name: Run PostgreSQL integration tests
        env:
          MC_REGISTRATION_WRITE_TEST_POSTGRES: 'Host=127.0.0.1;Database=mc_test_nutrition_ci;Username=postgres;Password=ci_disposable_only'
          MC_REGISTRATION_TEST_POSTGRES: 'Host=127.0.0.1;Database=mc_test_nutrition_ci;Username=postgres;Password=ci_disposable_only'
          MC_RETRY_TEST_POSTGRES: 'Host=127.0.0.1;Database=mc_retry_disposable;Username=postgres;Password=ci_disposable_only'
          MC_PG09_LOAD_POSTGRES: 'Host=127.0.0.1;Database=mc_pg09_disposable;Username=mc_ci_migrator;Password=ci_disposable_only'
          MC_SCHEMA_COMPATIBILITY_POSTGRES: 'Host=127.0.0.1;Database=postgres;Username=postgres;Password=ci_disposable_only'
        run: |
          dotnet test tests/MuscleCuties.Registration.Integration.Tests/MuscleCuties.Registration.Integration.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=postgres-integration-tests.trx" \
            --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-test-results
          path: test-results/
          retention-days: 30
