name: Backend Build & Packaging

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded artifact bundle
        value: ${{ jobs.package_backend.outputs.artifact-name }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package_backend:
    name: package_backend
    runs-on: ubuntu-latest
    outputs:
      artifact-name: backend-artifacts-${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Amazon Lambda Tools
        run: |
          dotnet tool install Amazon.Lambda.Tools --version 7.0.0 --tool-path .tools

      - name: Package MuscleCuties.Server (API)
        run: |
          mkdir -p artifacts
          ./.tools/dotnet-lambda package \
            --project-location services/MuscleCuties.Server \
            --configuration Release \
            --framework net10.0 \
            --function-architecture arm64 \
            --output-package artifacts/MuscleCuties.Server.zip

      - name: Validate Server package & generate manifest
        run: |
          export SOURCE_COMMIT_SHA="${{ github.sha }}"
          export SOURCE_TREE_SHA="$(git rev-parse HEAD^{tree})"
          bash tools/deployment/validate-package.sh artifacts/MuscleCuties.Server.zip artifacts/build-manifest.json

      - name: Package MuscleCuties.WorkoutReconciliation (Worker)
        run: |
          dotnet publish services/MuscleCuties.WorkoutReconciliation/MuscleCuties.WorkoutReconciliation.csproj \
            --configuration Release \
            --runtime linux-arm64 \
            --self-contained false \
            --output artifacts/worker-publish
          cd artifacts/worker-publish && zip -r ../MuscleCuties.WorkoutReconciliation.zip . && cd ../..
          sha256sum artifacts/MuscleCuties.WorkoutReconciliation.zip > artifacts/worker-checksum.txt

      - name: Upload immutable backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts-${{ github.sha }}
          path: artifacts/
          retention-days: 30
